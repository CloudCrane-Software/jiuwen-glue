[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jiuwen-console-tui"
version = "0.1.0"
description = "jiuwen 治理面作战室 TUI（WO-0012 / PROP-0005，PROP-0001 v1.7 §12.3）：塔式多列布局，五个数据面板（工单看板/租约/ask 审批队列/决策记录/节点利用率），三级干预 s/a/p 全部经控制台留痕。执行面交互不在本工具范围（那是 jiuwenswarm 自带 TUI）。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "CloudCrane-Software" }]
keywords = ["openjiwen", "glue", "console", "tui", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# textual 是 TUI 的合理硬依赖（data 层不依赖它——无 textual 时 data/状态机照常可用）
dependencies = ["textual>=1.0"]

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.1"]   # 缺失时 TUI 仍可跑 MOCK 模式
dev = ["pytest>=8"]

[project.scripts]
jiuwen-console = "console_tui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# 独立 testpaths：在 tools/console-tui 下跑 pytest 不得向上漂移到仓库根配置
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"          # pytest-asyncio：Textual run_test 异步用例自动收集
