      五步链路（create→submit→finalize→gate→void）；ASK 仅 permission_rail 可提交；
      必填缺交折算 UNKNOWN 参与同一聚合（R6/D1）。
    layer: pr
    tier: T1
    mode: blocking
    scope: full-repo
    cache_key: "hash(src/jiuwen_glue/guardrail.py, specs/guardrail.spec.md)"
    retry: 1
    flaky_policy: "纯函数确定性；状态机测试用 clock fixture 隔离"
    fail_action: PR 不可合并；回吐 reason_code=IMPL_BUG
    reason_codes: [IMPL_BUG, SPEC_GAP]
    write_time_mirror: "none"
    evidence_ledger: "gates/health-ledger.md#guardrail-aggregate"
    implementation:
      src: src/jiuwen_glue/guardrail.py:75-93 (aggregate), 210-348 (GuardrailRunStore)
      test: tests/test_guardrail.py (22 tests)
      contracts: contracts/registry.json:1 (jiuwen_glue.guardrail.aggregate @ 1.0.1)
    cadence: null
    metrics:
      unique_captures: "probed: W-01 缺陷#2（空集 fail-open）; R5/D1 非规范值 fail-open; R6/D1 缺交短路; D1-R8 split_task 等 16 缺陷均过本门禁"
      false_positives: "0（spec 正反例 14+14 全量断言）"

