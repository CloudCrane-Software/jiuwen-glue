# jiuwen-glue gates registry (v0.9)
# GP §4.1 门禁注册表 — 全部门禁单一事实源
# 收敛规则 R-S / R-E / R-L / R-O 见顶层 convergence_rules 节
# 变更: PR + 元资产人审 (TR-H 映射 → 四类硬清单)

schema_version: "gates-registry/0.9"
description: >
  jiuwen-glue 现有门禁全量注册表（GP §4.1 schema 全字段；v0.9 = 初始盘点版）。
  layer/tier/mode 枚举严格按 GP §4.1 / §4.2；write_time_mirror 指向 L0 最左可执行位。
last_updated: "2026-09-30"

convergence_rules:
  R_S: "converge 报告 Converged + checklist 全绿 + 多 judge κ≥0.75（CP-1）"
  R_E: "统计功效先算 CI 宽度再定 N；eval 未成熟模块不得进 TR-2 以上自动合入（CP-2）"
  R_L: "churn 高而 eval 未动 → 打标 → 自动生成资产刷新扇出任务（CP-3）"
  R_O: "判官入职测试复用漂移案例；错误消息质量 lint 入候选（可选优化 O-5/O-6）"

gates:

  # ──────────────────────────────────────────────────────────────
  # T0 秒级突发（≤30s，push 并行）
  # ──────────────────────────────────────────────────────────────
  - id: spec-gate-static
    title: spec-gate 静态一致性（D1/D2/D3/D4/D5/D6 静态分量）
    description: >
      specs/*.spec.md 元数据/REQ 唯一/五要素齐全 + guardrail 可执行正例逐条对冻结契约实现断言 +
      红反例与 spec 一致 + D3/D6 空证据 BLOCKED 裁决（v2.1 原则 2）。
      CI 环节9 口径 = --static-only；六维全跑按需。
    layer: pr
    tier: T0
    mode: blocking
    scope: full-repo
    cache_key: "hash(specs/*.spec.md, evals/**/red_cases.jsonl)"
    retry: 1
    flaky_policy: "非确定性维度（D3/D6）缺证据即 BLOCKED，不做重试掩盖"
    fail_action: PR 不可合并；回吐 reason_code=SPEC_GAP/EVAL_BUG
    reason_codes: [SPEC_GAP, EVAL_BUG, GATE_BUG]
    write_time_mirror: "lint-type-format"
    evidence_ledger: "gates/health-ledger.md#spec-gate-static"
    implementation:
      src: tools/spec-gate/spec_gate.py:389-421 (static_consistency)
      test: tools/spec-gate/tests/test_gate_semantics.py (10 tests)
      ci_ref: ".github/workflows/ci.yml (pytest, tools/spec-gate/tests/)"
    cadence: null
    metrics:
      unique_captures: pending
      false_positives: pending

  - id: contract-hash-check
    title: 契约 hash 秒检（G7）
    description: >
      contracts/registry.json 每条 (ref, semver) → sha256：重算实现文件哈希并比对。
      全部一致 → 0；任何不一致/文件缺失/表损坏 → 1（fail-closed）。
      breaking 分类按 breaking_policy 人工裁决，本脚本只负责秒检与拦截。
    layer: pr
    tier: T0
    mode: blocking
    scope: full-repo
    cache_key: "hash(contracts/registry.json)"
    retry: 0
    flaky_policy: "纯标准库零网络，抖动概率 ≈ 0；不重试"
    fail_action: PR 不可合并；回吐 reason_code=SPEC_GAP
    reason_codes: [SPEC_GAP, GATE_BUG]
    write_time_mirror: "none"
    evidence_ledger: "gates/health-ledger.md#contract-hash-check"
    implementation:
      src: tools/check_contracts.py
      test: 手动回归（README 示例 + CI 间接覆盖）
      ci_ref: ".github/workflows/ci.yml (pytest 间接覆盖 check_contracts 导入路径)"
    cadence: null
    metrics:
      unique_captures: "probed: 历史 1 条全部一致（ci.yml 注释 D1-R5 轮）"
      false_positives: "0（纯哈希比对，无误报路径）"

  - id: registry-drift-check
    title: 注册表漂移校验（GP §6.3 / §8 元门禁）
    description: >
      tools/gate-registry/validate.py --check：注册表声明的门禁 vs CI 配置实际跑的 diff 报告。
      新增门禁未接线 / 下线门禁仍在 CI 运行 → 漂移 WARN/FAIL。
    layer: pr
    tier: T0
    mode: blocking
    scope: full-repo
    cache_key: "hash(gates/registry.yaml, .github/workflows/ci.yml)"
    retry: 0
    flaky_policy: "YAML/正则解析确定性输出，不重试"
    fail_action: PR 不可合并；漂移项须随 PR 同批消账
    reason_codes: [GATE_BUG]
    write_time_mirror: "none"
    evidence_ledger: "gates/health-ledger.md#registry-drift-check"
    implementation:
      src: tools/gate-registry/validate.py
      test: tools/gate-registry/tests/test_validate.py (≥6 tests)
      ci_ref: ".github/workflows/ci.yml (待接线，v0.9 仅本地手动)"
    cadence: null
    metrics:
      unique_captures: pending
      false_positives: pending

  # ──────────────────────────────────────────────────────────────
  # T1 分钟级并行（≤15min，T0 全绿后并行）
  # ──────────────────────────────────────────────────────────────
  - id: ci-pytest-suite
    title: glue pytest 全量（四 testpaths 整仓门禁）
    description: >
      仓根裸 pytest 全量，floor=535（CI 口径；主包 399 + e2b_compat 41 + console-tui 87 +
      spec-gate 语义 9 = 536，1 skip）。floor 随上游棘轮只升不降，不许静默放行。
      testpaths = tests/ + providers/e2b_compat/ + tools/console-tui/ + tools/spec-gate/tests/
    layer: pr
    tier: T1
    mode: blocking
    scope: full-repo
    cache_key: "hash(src/**/*.py, tests/**/*.py, providers/**/*.py, tools/**/*.py)"
    retry: 1
    flaky_policy: >
      flaky 率 SLO<1%；隔离复跑一次；仍失败 → quarantine(tests/quarantine.yaml, TTL=+14d) +
      reason_code=FLAKY 登记 + 缺陷单。非确定性门禁确定性化（temperature=0 / median-of-3 /
      属性测试固定种子）。
    fail_action: PR 不可合并；全量回吐（T1 失败 → T2 不跑）
    reason_codes: [IMPL_BUG, EVAL_BUG, FLAKY, INFRA]
    write_time_mirror: "stop-hook-affected-tests"
    evidence_ledger: "gates/health-ledger.md#ci-pytest-suite"
    implementation:
      src: src/**/*.py
      test: tests/ providers/e2b_compat/ tools/console-tui/ tools/spec-gate/tests/
      ci_ref: ".github/workflows/ci.yml:88-120"
    cadence: null
    metrics:
      unique_captures: "probed: ci.yml D1-R8 轮捕获 16 缺陷（两批 8+8）"
      false_positives: "0（floor 棘轮 + quarantine 隔离双控）"

