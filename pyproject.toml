[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jiuwen-glue"
version = "0.2.0"
description = "openJiuwen glue layer: Budget Lease (with frozen effective-permission intersection at grant time), Evidence (3 states), capability metadata registry, the three coordination iron rules, GuardrailRun protocol aggregation (fail-closed), three-layer composite identity, structured Challenge, memory promotion pipeline, append-only decision records, artifact routes and node capacity. Native openJiuwen capabilities are used as-is; this package only implements what openJiuwen does not have and adds no second decision point."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "CloudCrane-Software" }]
keywords = ["openjiuwen", "agent", "budget-lease", "evidence", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# 仓根裸 pytest 即整仓门禁口径：主包 tests/ + e2b_compat + console-tui 子包
# + spec-gate 语义测试 全部收集（D1 修复：此前 testpaths 只含 tests/，根裸
# pytest 恒不收集两子包，CNB 环节5 因此漏掉 41+76+ 例回归。D1-R3 起再纳入
# tools/spec-gate/tests——spec-gate fail-closed 语义回归钉（空证据维度
# BLOCKED 非零退出）自此随整仓门禁自动跑，不再只靠人工按需运行）。
# 子包目录下单独跑 pytest 仍走各自 ini。
testpaths = ["tests", "providers/e2b_compat/tests", "tools/console-tui/tests",
             "tools/spec-gate/tests"]
addopts = "-q"
# 从仓库外整仓收集（如 python -m pytest <repo>/ -q）时，rootdir 配置取本文件，
# 子包各自 pyproject 的 ini 不再生效——这里集中声明子包 src 路径与 asyncio 模式，
# 保证 tests/ 与 providers/、tools/ 子包测试在同一会话内可全部收集执行。
pythonpath = [
    "src",
    "providers/e2b_compat/src",
    "tools/console-tui/src",
]
asyncio_mode = "auto"
