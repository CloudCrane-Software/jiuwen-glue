# glue CI 门禁（D1-R2 修复：主仓此前无任何仓内推送触发的测试门禁——回归只能等
# company-ops CNB 流水线（push company-ops main 时拉 GitHub main）才暴露，直接
# push 本仓不触发任何检查。对齐 D1-R1 先例：session-broker/skill-pack 各有 ci.yml）。
# 元资产纪律（PROP-0001 v2.1 §11/§14）：本文件改动强制 owner PR 审（zizmor 常开）。
# 口径：仓根裸 pytest 全量（testpaths 四件套 = tests/ + providers/e2b_compat +
# tools/console-tui + tools/spec-gate/tests），floor 断言随上游如实核查回填
# （只升不降，不许静默放行）；当前 floor=500 对应 D1-R5 修复提交本地实测 500
# passed（主包 363 + e2b_compat 41 + console-tui 87 + spec-gate 语义测试 9）。
# D1-R3：spec-gate fail-closed 语义回归钉（空证据维度 BLOCKED 非零退出）自本轮
# 起随整仓门禁自动跑，不再只靠人工按需运行（验收 D1-R3 Issue#2）。
# D4-R3：spec-gate --static-only 与全跑同口径（空证据 BLOCKED 非零退出，验收
# D4-R3 #7）+ 语义回归钉 7→9 例（static-only BLOCKED / 证据完备 exit 0 / D6 FAIL），
# floor 495→497 同轮棘轮。
# D1-R4：租约派生同租户不变式（跨租户派生拒绝 + 继承父租户，验收 D1-R4 #2）
# 补 2 用例，floor 497→499 同轮棘轮。
# D1-R5：aggregate 非法判定值收敛 UNKNOWN（fail-closed 无例外，验收 D1-R5 #1）
# 补 1 用例，floor 499→500 同轮棘轮。另有双聚合一致性回归 1 例
# （test_aggregate_matches_eval_gate_reference）需 eval-gate 在场，CI 不装则
# skip（eval-gate 在场 501 passed + 0 skipped / CI 不装 500 passed + 1 skipped，实测两种口径）——floor 按
# CI 口径 500 计，skip 不计入 passed（eval-gate README 偏差登记行 R5 订正句）。
# D1-R6：gate() 必填缺交折算 UNKNOWN 参与聚合（不短路掩盖已提交 BLOCKED，
# 验收 R6-D1 #1）补 3 用例（guardrail 2 + admission 1），floor 500→503 同轮棘轮
# （eval-gate 在场口径 504 passed + 0 skipped 实测）。
# D1-R7：非有限数值闸三处同口径收口（challenge ttl / billing+usage occurred_at
# 与 quantity / escalate time_budget_seconds——NaN/±inf/巨型 int fail-open，
# 验收 R7-D1 三条；src 修复随 #16 并入，本提交补回归钉与棘轮）补 5 用例
# （challenge 1 + escalation 1 + billing 2 + usage 1），floor 503→508 同轮棘轮
# （eval-gate 在场口径 509 passed + 0 skipped 实测）。
# D1-R7 二轮（grok 交叉红队复验）：_in_window duck 路径 float() 转换包转
# （巨型 int/datetime/垃圾 str 不再 OverflowError/TypeError/ValueError 未归类
# 崩溃）+ 四模块 _finite 增纳 TypeError（非数值 → 非有限归类拒绝）补 1 用例，
# floor 508→509 同轮棘轮（eval-gate 在场口径 510 passed + 0 skipped 实测）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # pyyaml：test_harness_package_glue_governance 有 importorskip("yaml") 用例——
        # 不装则 CI 上 486 passed + 1 skipped，floor=487 会误红（2026-09-28 首跑实测）。
        run: python -m pip install --upgrade pip && python -m pip install pytest pytest-asyncio textual pyyaml -e .
      - name: pytest with floor
        run: |
          set -e
          python -m pytest > pytest.log 2>&1 || { tail -30 pytest.log; exit 1; }
          tail -3 pytest.log
          N="$(grep -oE '[0-9]+ passed' pytest.log | tail -1 | grep -oE '[0-9]+')"
          [ -n "$N" ] || { echo "cannot parse passed count"; tail -30 pytest.log; exit 1; }
          [ "$N" -ge 509 ] || { echo "passed=$N < 509 (upstream changed? re-verify and re-ratchet, never silently loosen)"; exit 1; }
          echo "jiuwen-glue floor OK: $N passed (>= 509)"
